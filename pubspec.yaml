name: flutter_economarket
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_auth: 6.7.1
  firebase_core: 4.15.2
  flutter:
    sdk: flutter
  google_sign_in: 7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  flutter_native_splash: ^2.4.8
  shared_preferences: 2.5.6
  geolocator: 14.1.2
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.1

flutter:
  uses-material-design: true
  assets:
    - "assets/Ícone do app (1024 px)@1x.png"
    - "assets/ecomarket_splash_branding.png"
    - "assets/icon/icon.png"

flutter_native_splash:
  color: "#0E7A38"
  image: "assets/Ícone do app (1024 px)@1x.png"
  branding: "assets/ecomarket_splash_branding.png"
  branding_bottom_padding: 32
  fullscreen: true
  web: true
  android_12:
    color: "#0E7A38"
    image: "assets/Ícone do app (1024 px)@1x.png"
    icon_background_color: "#0E7A38"
    branding: "assets/ecomarket_splash_branding.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E7A38"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
